name: iOS Build & Test (macOS Cloud)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: XcodeGen + Build + SwiftData Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: FinControlApp
        run: xcodegen generate

      - name: Find available iOS Simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get('devices', {}).items(), reverse=True):
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d.get('name', '') and d.get('isAvailable'):
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Using Simulator UDID: $SIM_ID"

      - name: Build and Run Tests on iOS Simulator
        working-directory: FinControlApp
        run: |
          xcodebuild test \
            -project FinControlApp.xcodeproj \
            -scheme FinControlApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Archive Release Build for Physical iPhone (Unsigned)
        working-directory: FinControlApp
        run: |
          xcodebuild archive \
            -project FinControlApp.xcodeproj \
            -scheme FinControlApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FinControlApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package FinControlPro.ipa
        working-directory: FinControlApp
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/FinControlApp.xcarchive/Products/Applications/FinControlApp.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../FinControlPro.ipa Payload
          ls -lh ../FinControlPro.ipa

      - name: Upload FinControlPro.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinControlPro-iOS-IPA
          path: FinControlApp/build/FinControlPro.ipa
          if-no-files-found: error
          retention-days: 30
