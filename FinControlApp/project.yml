name: FinControlApp
options:
  bundleIdPrefix: com.fincontrol
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  FinControlApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Components
      - path: Utilities
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fincontrol.pro
        PRODUCT_NAME: FinControlApp
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - FinControlAppTests

  FinControlAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FinControlApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fincontrol.pro.tests
        PRODUCT_NAME: FinControlAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FinControlApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FinControlApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
